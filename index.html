<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Viaje Trazacaminos</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: url('Pagina_Principal.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Lora', serif;
            color: #f3e5ab;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .pantalla {
            display: none;
            width: 100vw;
            min-height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            flex-direction: column;
        }

        .pantalla.activa {
            display: flex;
        }

        .hxr-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            width: 100%;
            z-index: 10;
        }

        .top-controles-der {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-btn, .close-btn {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            cursor: pointer;
            color: #f9f1d9;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            transition: background 0.2s;
        }

        .menu-btn:hover, .close-btn:hover {
            background: rgba(212, 175, 55, 0.25);
        }

        .escenario-expreso {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
            padding: 20px;
        }

        .zona-clics-libros {
            position: relative;
            width: 100%;
            max-width: 820px;
            height: 400px;
            display: flex;
            justify-content: space-between;
            z-index: 5;
            margin-top: 20px;
        }

        .hotspot-libro {
            width: 30%;
            height: 100%;
            cursor: pointer;
            background: transparent;
            border-radius: 12px;
        }

        /* ===== Lista vertical de tomos (solo visible en celular) ===== */
        .lista-movil {
            display: none;
        }

        .tomo-movil {
            width: 100%;
            aspect-ratio: 560 / 760;
            cursor: pointer;
            background-image: url('Pagina_Principal.jpg');
            background-repeat: no-repeat;
            background-size: 460% auto;
            border: 3px solid #b8860b;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.2s ease;
        }

        .tomo-movil:active {
            transform: scale(0.97);
        }

        .tomo-movil.m1 { background-position: 23.8% 60.5%; }
        .tomo-movil.m2 { background-position: 51.1% 60.5%; }
        .tomo-movil.m3 { background-position: 78% 60.5%; }

        @media (max-width: 768px) {
            body {
                background:
                    radial-gradient(1.5px 1.5px at 20% 15%, #fff, transparent),
                    radial-gradient(1px 1px at 70% 25%, #f3e5ab, transparent),
                    radial-gradient(1.5px 1.5px at 40% 55%, #fff, transparent),
                    radial-gradient(1px 1px at 85% 70%, #fff, transparent),
                    radial-gradient(1.5px 1.5px at 10% 85%, #f3e5ab, transparent),
                    radial-gradient(1px 1px at 60% 90%, #fff, transparent),
                    radial-gradient(ellipse at 50% 0%, #2a2250 0%, transparent 60%),
                    linear-gradient(180deg, #0b0d24 0%, #14122e 50%, #1d1a2b 100%);
                background-attachment: fixed;
                background-color: #0b0d24;
            }

            .zona-clics-libros {
                display: none;
            }

            .lista-movil {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 22px;
                width: 100%;
                max-width: 340px;
                margin-top: 10px;
                padding-bottom: 30px;
            }

            #pantalla-inicio .escenario-expreso {
                justify-content: flex-start;
            }
        }

        @media (min-width: 769px) {
            #pantalla-inicio .titulo-principal {
                visibility: hidden;
            }
        }

        /* Pantalla de Lectura */
        .titulo-principal {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: #f9f1d9;
            letter-spacing: 2px;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.9);
            margin-bottom: 15px;
            text-align: center;
            padding: 0 10px;
        }

        .marco-dorado-ui {
            background: rgba(245, 239, 230, 0.95);
            border: 3px solid #b8860b;
            border-radius: 6px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            padding: 20px;
            width: 92vw;
            max-width: 900px;
            text-align: center;
            position: relative;
            margin: auto;
        }

        .libro-abierto-layout {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 15px;
            background: #fdfbf7;
            color: #2c221e;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
        }

        @media (min-width: 768px) {
            .libro-abierto-layout {
                flex-direction: row;
                height: 450px;
            }
            .titulo-principal {
                font-size: 2.3rem;
            }
        }

        .pagina {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .pagina.izquierda {
            border-bottom: 2px solid #e3dcd2;
            padding-bottom: 15px;
            align-items: center;
        }

        @media (min-width: 768px) {
            .pagina.izquierda {
                border-bottom: none;
                border-right: 2px solid #e3dcd2;
                padding-bottom: 0;
                padding-right: 15px;
            }
        }

        .pagina-vacia-texto {
            color: #7c6f59;
            font-size: 1rem;
            text-align: center;
            padding: 15px;
            font-style: italic;
        }

        .caja-dialogo-estilo {
            background: rgba(26, 26, 36, 0.95);
            color: #f3e5ab;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #d4af37;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            min-height: 250px;
        }

        .texto-maquina {
            font-size: 0.85rem;
            line-height: 1.5;
            overflow-y: auto;
            max-height: 220px;
            padding-right: 5px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .btn-viaje {
            align-self: flex-end;
            background: #d4af37;
            color: #1a1a24;
            border: none;
            padding: 8px 18px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Audio de inicio de Honkai: Star Rail -->
    <audio id="musica-hsr" src="musica_inicio_hsr.mp3" loop preload="auto"></audio>

    <!-- Pantalla 1: Selección de Tomos -->
    <div id="pantalla-inicio" class="pantalla activa">
        <header class="hxr-top-bar">
            <div class="menu-btn" onclick="window.location.reload()">≡ Menu</div>
            <div class="top-controles-der">
                <div class="menu-btn btn-audio" onclick="toggleAudio()">♪ Música: ON</div>
                <div class="close-btn">×</div>
            </div>
        </header>

        <div class="escenario-expreso">
            <h1 class="titulo-principal">Nuestro Viaje Trazacaminos</h1>

            <div class="zona-clics-libros">
                <div class="hotspot-libro" onclick="abrirTomo(1)" title="Tomo I"></div>
                <div class="hotspot-libro" onclick="abrirTomo(2)" title="Tomo II"></div>
                <div class="hotspot-libro" onclick="abrirTomo(3)" title="Tomo III"></div>
            </div>

            <div class="lista-movil">
                <div class="tomo-movil m1" onclick="abrirTomo(1)" title="Tomo I"></div>
                <div class="tomo-movil m2" onclick="abrirTomo(2)" title="Tomo II"></div>
                <div class="tomo-movil m3" onclick="abrirTomo(3)" title="Tomo III"></div>
            </div>
        </div>
    </div>

    <!-- Pantalla 2: Lectura Interactiva del Tomo -->
    <div id="pantalla-lectura" class="pantalla">
        <header class="hxr-top-bar">
            <div class="menu-btn" onclick="volverBiblioteca()">← Volver</div>
            <div class="top-controles-der">
                <div class="menu-btn btn-audio" onclick="toggleAudio()">♪ Música: ON</div>
                <div class="close-btn" onclick="volverBiblioteca()">×</div>
            </div>
        </header>

        <div class="escenario-expreso">
            <h1 id="titulo-tomo-activo" class="titulo-principal">Tomo I</h1>
            
            <div class="marco-dorado-ui libro-abierto-layout">
                <div class="pagina izquierda">
                    <div class="pagina-vacia-texto">
                        <p><i id="frase-tomo">"El viaje de un Trazacaminos se escribe paso a paso..."</i></p>
                    </div>
                </div>
                <div class="pagina derecha">
                    <div class="caja-dialogo-estilo">
                        <div id="texto-narrativo" class="texto-maquina"></div>
                        <button id="btn-comenzar-viaje" class="btn-viaje" onclick="iniciarEscritura()">Comenzar viaje</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const textosTomos = {
            1: `Tomo I (Suki): En esta fecha especial te recuerdo un poquito de nuestro pequeño viaje juntos este año, por supuesto por el inicio. Recuerdo bien que no empezamos a hablar, al inicio de cualquier sonsera del team o de los juegos, cada día haciéndonos más cercanos, conociéndonos un poquito más, sin esperar nada ni buscarlo, solo acompañando al otro en un momento que podía ser bueno o malo. Estuvimos cerca, dejamos de hablar un tiempo (culpa mía jsjs), aún así te quedaste esperándome... creo que eso me dio la primera pista.`,
            2: `Tomo II (Daisuki): Poco a poco, lo que era una amistad naciente se convirtió en algo más profundo, más difícil de entender y nombrar. A pesar de la distancia, a pesar del alejamiento repentino, cuando volvimos a hablar todo fluyó igual o mejor que antes, como un engranaje que se acopla perfectamente a su maquinaria ideal. Y así pasó repentinamente, sin darnos cuenta sucedió, aquella noche en que nos unimos por decisión, voluntad y amor.`,
            3: `Tomo III (Aishiteru): El tiempo ha pasado rápido hasta hoy en día, donde nuestro vínculo es sólido y lleno de un amor inmenso. Miramos hacia adelante compartiendo sueños, metas, con tantas cosas pendientes tanto cada uno por su lado como juntos. Por eso, hoy, mi querida Samantha, quiero agradecerte, gracias por permanecer a mi lado a lo largo de todo este tiempo, por quedarte incluso cuando llegaban momentos en los que era algo difícil o ambos estábamos demasiado ocupados. Hoy y siempre te voy a amar mi vida, hasta el fin de nuestro viaje por el vasto universo...`
        };

        const frasesTomos = {
            1: `“El viaje de un Trazacaminos se escribe paso a paso...”`,
            2: `“....conociendo a personas desconocidas que, sin saberlo, un día pueden volverse muy importantes.....”`,
            3: `“.... tanto que llegará el día en que ansies que permanezcan en el expreso, viajando a tu lado.”`
        };

        let tomoActual = 1;
        let intervaloEscritura = null;

        // Control de música de fondo
        const audioHSR = document.getElementById('musica-hsr');
        let audioIniciado = false;
        let silenciadoManualmente = false;

        function actualizarEtiquetasAudio(encendida) {
            document.querySelectorAll('.btn-audio').forEach((btn) => {
                btn.textContent = encendida ? '♪ Música: ON' : '♪ Música: OFF';
            });
        }

        function reproducirAlInteractuar() {
            if (!audioIniciado && !silenciadoManualmente && audioHSR) {
                audioHSR.volume = 0.35;
                audioHSR.play().then(() => {
                    audioIniciado = true;
                    actualizarEtiquetasAudio(true);
                }).catch(() => {});
            }
        }

        function toggleAudio() {
            if (!audioHSR) return;
            audioHSR.volume = 0.35;
            if (audioHSR.paused) {
                silenciadoManualmente = false;
                audioHSR.play().then(() => {
                    audioIniciado = true;
                    actualizarEtiquetasAudio(true);
                }).catch(() => {});
            } else {
                silenciadoManualmente = true;
                audioHSR.pause();
                actualizarEtiquetasAudio(false);
            }
        }

        document.addEventListener('click', reproducirAlInteractuar, { once: true });
        document.addEventListener('touchstart', reproducirAlInteractuar, { once: true });

        function abrirTomo(numero) {
            reproducirAlInteractuar();
            tomoActual = numero;
            document.getElementById('frase-tomo').textContent = frasesTomos[numero];
            document.getElementById('pantalla-inicio').classList.remove('activa');
            document.getElementById('pantalla-lectura').classList.add('activa');
            document.getElementById('titulo-tomo-activo').innerText = `Tomo ${numero}`;
            
            document.getElementById('texto-narrativo').textContent = "Haz clic en 'Comenzar viaje' para desvelar las páginas de este capítulo...";
            document.getElementById('btn-comenzar-viaje').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function volverBiblioteca() {
            clearInterval(intervaloEscritura);
            document.getElementById('pantalla-lectura').classList.remove('activa');
            document.getElementById('pantalla-inicio').classList.add('activa');
            window.scrollTo(0, 0);
        }

        function iniciarEscritura() {
            reproducirAlInteractuar();
            const boton = document.getElementById('btn-comenzar-viaje');
            boton.style.display = 'none'; 
            
            const contenedorTexto = document.getElementById('texto-narrativo');
            contenedorTexto.textContent = ""; 
            
            const textoCompleto = textosTomos[tomoActual];
            let i = 0;
            let textoEscrito = "";
            
            clearInterval(intervaloEscritura);
            intervaloEscritura = setInterval(() => {
                if (i < textoCompleto.length) {
                    textoEscrito += textoCompleto.charAt(i);
                    contenedorTexto.textContent = textoEscrito;
                    i++;
                } else {
                    clearInterval(intervaloEscritura);
                }
            }, 25); 
        }
        window.abrirTomo = abrirTomo;
        window.volverBiblioteca = volverBiblioteca;
        window.iniciarEscritura = iniciarEscritura;
        window.toggleAudio = toggleAudio;
    </script>
</body>
</html>
